app = "solana-monitor"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONPATH = "/app"
  PORT = "8080"
  PYTHONPATH = "/app"
  SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = "80"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = "443"

[deploy]
  strategy = "immediate"
