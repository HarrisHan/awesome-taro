[project]
name = "solana-monitor"
version = "1.0.0"
description = "Solana Token Monitoring System"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
